version: "3.8"

services:
  breinplek:
    image: ghcr.io/iitssjstn/breinplek:latest
    container_name: breinplek
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    # ./content  -> artikelen/vragen (markdown), aanpasbaar via /admin.
    # ./data     -> bevat na de eenmalige setup het wachtwoord (gehasht) en de
    #               sessiesleutel. Niet verwijderen, anders is /admin/setup
    #               weer bereikbaar en moet je opnieuw een wachtwoord kiezen.
    volumes:
      - ./content:/app/content
      - ./data:/app/data
    ports:
      - "3010:3000"
    networks:
      - npm_network

networks:
  npm_network:
    external: true
    name: npm_network
